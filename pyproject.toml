[project]
name = "mappa"
version = "0.1.0"
description = "MAPPA 2.0: evidence-backed privacy and security assessment of Australian mHealth apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.1",
    "structlog>=26.1.0",
    "typer>=0.27.2",
]

[project.scripts]
mappa = "mappa.cli:app"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# DTZ bans naive datetimes: every stored timestamp must be UTC (CLAUDE.md principle 3).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "DTZ", "PTH", "C4", "PT", "RET"]

[tool.mypy]
# Strict everywhere, which covers the "strict on src/mappa/models" rule. A module that
# wraps an untyped third-party library may relax specific flags in an override below,
# with a comment saying why.
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
