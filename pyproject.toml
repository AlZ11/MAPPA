[project]
name = "mappa"
version = "0.1.0"
description = "MAPPA 2.0: evidence-backed privacy and security assessment of Australian mHealth apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-play-scraper>=1.2.7",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "playwright>=1.63.0",
    "py3langid>=0.4.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "sqlalchemy>=2.1.1",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "trafilatura>=2.3.1",
    "typer>=0.27.2",
]

[project.scripts]
mappa = "mappa.cli:app"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# DTZ bans naive datetimes: every stored timestamp must be UTC (CLAUDE.md principle 3).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "DTZ", "PTH", "C4", "PT", "RET"]

[tool.mypy]
# Strict everywhere, which covers the "strict on src/mappa/models" rule. A module that
# wraps an untyped third-party library may relax specific flags in an override below,
# with a comment saying why.
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Untyped third-party libraries: calls into them return Any, so their results are
# validated before use (see parse/play_data.py and parse/policy_text.py).
module = ["google_play_scraper.*", "py3langid.*", "trafilatura.*", "lxml", "lxml.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
